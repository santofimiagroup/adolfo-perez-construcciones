  <title>Adolfo Pérez Construcciones · Plataforma de operaciones (demo)</title>
  <script>
    // GitHub Pages: cualquier ruta desconocida vuelve a la aplicación (navegación por #)
    (function () { var p = location.pathname.replace(/\/+$/, ''); var seg = p.split('/').filter(Boolean); var base = location.hostname.endsWith('github.io') && seg.length ? '/' + seg[0] + '/' : '/'; location.replace(base + '#/inicio'); })();
  </script>
  <style>body{font-family:system-ui,sans-serif;background:#F8F7F4;color:#242824;display:grid;place-items:center;min-height:100vh;margin:0}a{color:#52634F}</style>
</head>
<body><p>Redirigiendo a la <a href="/">plataforma</a>…</p></body>
